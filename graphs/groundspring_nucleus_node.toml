# groundSpring Node Atomic Pipeline
# Node = Tower + ToadStool — science validation with GPU compute.
#
# This graph runs all 35 experiments through ToadStool GPU dispatch,
# compares against CPU references, and reports parity.
# Tower provides secure inter-primal communication (BearDog encryption,
# Songbird TLS). ToadStool provides barracuda GPU dispatch.
#
# STATUS: V124 (April 27, 2026) — barraCuda v0.3.12, measurement domain niche
# Atomic: Node (Tower + ToadStool)
# Experiments: 35 (395 validation checks)
# Substrates: CPU (reference) + GPU (barracuda dispatch, f64-capable device)
# Precision: WgpuDevice::new_f64_capable with fallback, DF64 strategy wired

[graph]
id = "groundspring_node_atomic"
description = "Node atomic: 35-experiment validation through ToadStool GPU dispatch"
coordination = "Parallel"

[graph.metadata]
toadstool_pin = "S158+"
toadstool_commit = "bfe7977b"
groundspring_version = "V125"
target_node = "eastgate"
domain = "measurement"

# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 1: TOWER BOOTSTRAP (secure communication layer)
# ═══════════════════════════════════════════════════════════════════════════════

[[nodes]]
id = "tower_bootstrap"
output = "tower_ready"

[nodes.operation]
name = "rpc_call"
target = "beardog"

[nodes.operation.params]
method = "tower.health"
params = {}

[nodes.constraints]
timeout_ms = 10000

# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 2: TOADSTOOL READINESS (compute layer)
# ═══════════════════════════════════════════════════════════════════════════════

[[nodes]]
id = "toadstool_ready"
depends_on = ["tower_bootstrap"]
output = "compute_available"

[nodes.operation]
name = "rpc_call"
target = "toadstool"

[nodes.operation.params]
method = "toadstool.health"
params = { check_gpu = true, check_barracuda = true }

[nodes.constraints]
timeout_ms = 30000

# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 3: VALIDATION DISPATCH (35 experiments, parallel where possible)
# ═══════════════════════════════════════════════════════════════════════════════

[[nodes]]
id = "validate_all_experiments"
depends_on = ["toadstool_ready"]
output = "validation_results"

[nodes.operation]
name = "capability_call"

[nodes.operation.params]
capability = "measurement.parity_check"
params = { experiments = "all", mode = "barracuda-gpu", expected_checks = 395 }

[nodes.constraints]
timeout_ms = 600000
fallback = "local"

# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 4: PARITY CERTIFICATE (28/28 PROVEN)
# ═══════════════════════════════════════════════════════════════════════════════

[[nodes]]
id = "parity_certificate"
depends_on = ["validate_all_experiments"]
output = "parity_report"

[nodes.operation]
name = "capability_call"

[nodes.operation.params]
capability = "measurement.uncertainty_budget"
params = { format = "json", include_timing = true, include_tolerances = true }

[nodes.constraints]
timeout_ms = 30000

# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 5: AUDIT — forward node validation to skunkBat (JH-5)
# ═══════════════════════════════════════════════════════════════════════════════

[[nodes]]
id = "audit_node_validation"
depends_on = ["parity_certificate"]
output = "audit_event_logged"

[nodes.operation]
name = "capability_call"

[nodes.operation.params]
capability = "security.audit_log"
params = { event = "validation.node_atomic", primal = "groundspring", family_id = "${FAMILY_ID}", details = { experiments = 35, checks = 395 } }

[nodes.constraints]
timeout_ms = 10000
fallback = "skip"
