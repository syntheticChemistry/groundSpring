# groundSpring Cross-Substrate Validation Pipeline
# Validates mathematical parity across CPU, GPU, and NPU substrates
# using metalForge dispatch and NUCLEUS atomic coordination.
#
# STATUS: V102 (March 14, 2026) — barraCuda v0.3.5, measurement domain niche
# Atomic: Node (Tower + ToadStool) — requires GPU compute (f64-capable device)
# Optional: Nest (Tower + NestGate) — provenance storage
#
# Pipeline: discover substrates → run CPU reference → dispatch GPU → dispatch NPU
#           → compare all three → store provenance

[graph]
id = "groundspring_cross_substrate"
description = "Three-tier validation: CPU reference → GPU parity → NPU parity → provenance"
coordination = "Sequential"

[graph.metadata]
toadstool_pin = "S130+"
toadstool_commit = "bfe7977b"
groundspring_version = "V102"
target_node = "eastgate"
domain = "measurement"

# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 1: SUBSTRATE DISCOVERY (metalForge)
# ═══════════════════════════════════════════════════════════════════════════════

[[nodes]]
id = "discover_substrates"
output = "substrate_inventory"

[nodes.operation]
name = "metalforge_discover"

[nodes.operation.params]
probe_gpu = true
probe_npu = true
probe_cpu = true

[nodes.constraints]
timeout_ms = 30000

# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 2: CPU REFERENCE (always available, sovereign fallback)
# ═══════════════════════════════════════════════════════════════════════════════

[[nodes]]
id = "cpu_reference"
depends_on = ["discover_substrates"]
output = "cpu_results"

[nodes.operation]
name = "capability_call"

[nodes.operation.params]
capability = "compute.execute"
params = { substrate = "cpu", op = "anderson_localization_sweep", disorder_strengths = [0.5, 2.0, 8.0], n_sites = 1000, seed = 42 }

[nodes.constraints]
timeout_ms = 120000

# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 3: GPU DISPATCH (ToadStool via barracuda)
# ═══════════════════════════════════════════════════════════════════════════════

[[nodes]]
id = "gpu_dispatch"
depends_on = ["discover_substrates"]
output = "gpu_results"

[nodes.operation]
name = "capability_call"

[nodes.operation.params]
capability = "compute.execute"
params = { substrate = "gpu", op = "anderson_localization_sweep", disorder_strengths = [0.5, 2.0, 8.0], n_sites = 1000, seed = 42 }

[nodes.constraints]
timeout_ms = 120000
fallback = "skip"

# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 4: NPU DISPATCH (AKD1000 via ToadStool akida-driver)
# ═══════════════════════════════════════════════════════════════════════════════

[[nodes]]
id = "npu_dispatch"
depends_on = ["cpu_reference"]
output = "npu_results"

[nodes.operation]
name = "capability_call"

[nodes.operation.params]
capability = "compute.execute"
params = { substrate = "npu", op = "anderson_regime_classify", disorder_strengths = [0.5, 2.0, 8.0], quantization_bits = 8 }

[nodes.constraints]
timeout_ms = 30000
fallback = "skip"

# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 5: TOLERANCE COMPARISON (metalForge tolerance module)
# ═══════════════════════════════════════════════════════════════════════════════

[[nodes]]
id = "tolerance_compare"
depends_on = ["cpu_reference", "gpu_dispatch", "npu_dispatch"]
output = "comparison_summary"

[nodes.operation]
name = "capability_call"

[nodes.operation.params]
capability = "measurement.parity_check"
params = { cpu_key = "cpu_results", gpu_key = "gpu_results", npu_key = "npu_results", tier_gpu = "exact", tier_npu = "quantized" }

[nodes.constraints]
timeout_ms = 10000

# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 6: PROVENANCE TRIO — record cross-substrate results
# ═══════════════════════════════════════════════════════════════════════════════

[[nodes]]
id = "provenance_session_start"
depends_on = ["tolerance_compare"]
output = "provenance_session_id"

[nodes.operation]
name = "capability_call"

[nodes.operation.params]
capability = "provenance.session_create"
params = { agent = "groundspring", experiment_id = "cross_substrate_${RUN_ID}", version = "V102", family_id = "groundspring" }

[nodes.constraints]
timeout_ms = 10000
fallback = "skip"

[[nodes]]
id = "store_provenance"
depends_on = ["provenance_session_start"]
output = "provenance_stored"

[nodes.operation]
name = "capability_call"

[nodes.operation.params]
capability = "storage.put"
params = { key = "groundspring:cross_substrate:${RUN_ID}", value = "${COMPARISON_SUMMARY_JSON}", family_id = "groundspring" }

[nodes.constraints]
timeout_ms = 30000
fallback = "local"

[[nodes]]
id = "provenance_commit"
depends_on = ["store_provenance"]
output = "provenance_committed"

[nodes.operation]
name = "capability_call"

[nodes.operation.params]
capability = "provenance.session_dehydrate"
params = { session_id = "${PROVENANCE_SESSION_ID}", summary = "${COMPARISON_SUMMARY_JSON}", agent = "groundspring", family_id = "groundspring" }

[nodes.constraints]
timeout_ms = 10000
fallback = "skip"

[[nodes]]
id = "provenance_attribute"
depends_on = ["provenance_commit"]
output = "attribution_recorded"

[nodes.operation]
name = "capability_call"

[nodes.operation.params]
capability = "contribution.recordDehydration"
params = { session_id = "${PROVENANCE_SESSION_ID}", contribution = "Cross-substrate parity validation", agent = "groundspring", family_id = "groundspring" }

[nodes.constraints]
timeout_ms = 10000
fallback = "skip"
