[package]
name = "groundspring"
version = "0.1.0"
publish = false
description = "Measurement noise characterization primitives — bias-variance decomposition, Monte Carlo error propagation, rarefaction, seismic inversion"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Tier 4 IPC-first: no features enabled by default. All primal interactions via IPC.
default = []
# Opt-in direct library linkage to barraCuda (bypasses IPC; for development/benchmarking).
local = ["barracuda"]
# Enable barraCuda math primitives as a library dependency (CPU path).
barracuda = ["dep:barracuda"]
# Reserved: when activated, switches default PRNG from Xorshift64 to xoshiro128**.
# Requires full stochastic experiment rebaseline (GAP-GS-011). Currently a no-op.
prng-xoshiro-default = []
# Full GPU dispatch: barraCuda library + wgpu adapter + domain-specific GPU kernels (ESN, genomics).
barracuda-gpu = ["barracuda", "barracuda/gpu", "barracuda/domain-esn", "barracuda/domain-genomics", "dep:wgpu", "dep:bytemuck"]
# Nautilus stochastic process library (bingocube ecosystem).
nautilus = ["dep:bingocube-nautilus"]
# biomeOS integration: JSON-RPC communication, structured logging, socket discovery.
biomeos = ["dep:serde_json", "dep:tracing", "dep:tracing-subscriber"]
# BrainChip Akida NPU acceleration for int8-quantized workloads.
npu = ["dep:akida-driver"]
# Type-safe tarpc IPC for high-performance primal-to-primal communication.
tarpc-ipc = ["dep:tarpc", "dep:tokio", "dep:serde"]
# guideStone certification: NUCLEUS layer validation, deploy graph checks, primalSpring pin.
certification = ["dep:primalspring", "dep:serde_json", "dep:tracing"]
# Alias: `validation` and `certification` are synonymous. Both exist for semantic clarity
# in downstream feature gates (e.g. `required-features = ["validation"]` on validator bins).
validation = ["certification"]
# Eukaryotic UniBin: single binary with certify/validate/status/version subcommands.
unibin = ["certification", "validation", "dep:clap"]

[dependencies]
thiserror = "2"
barracuda = { path = "../../../../primals/barraCuda/crates/barracuda", optional = true, default-features = false }
bingocube-nautilus = { path = "../../../../primals/bingoCube/nautilus", optional = true }
akida-driver = { path = "../../../../primals/toadStool/crates/neuromorphic/akida-driver", optional = true }
wgpu = { version = "28", optional = true, default-features = false, features = ["wgsl", "vulkan-portability"] }
bytemuck = { version = "1", optional = true, features = ["derive"] }
primalspring = { path = "../../../primalSpring/ecoPrimal", optional = true }
serde_json = { version = "1", optional = true }
clap = { version = "4", optional = true, features = ["derive"] }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["fmt", "env-filter"] }
serde = { version = "1", optional = true, features = ["derive"] }
tarpc = { version = "0.37", optional = true, features = ["serde-transport", "serde-transport-json", "tokio1", "unix"] }
tokio = { version = "1", optional = true, features = ["rt", "net"] }

[[bin]]
name = "groundspring"
path = "src/bin/groundspring_primal.rs"
required-features = ["biomeos"]

[[bin]]
name = "groundspring_unibin"
path = "src/bin/groundspring_unibin.rs"
required-features = ["unibin"]

[dev-dependencies]
proptest = "1"
temp-env = "0.3.6"
tempfile = "3.26.0"
