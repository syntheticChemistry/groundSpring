[package]
name = "groundspring"
version = "0.1.0"
description = "Measurement noise characterization primitives — bias-variance decomposition, Monte Carlo error propagation, rarefaction, seismic inversion"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["barracuda"]
barracuda = ["dep:barracuda"]
barracuda-gpu = ["barracuda", "barracuda/gpu", "dep:wgpu", "dep:bytemuck"]
nautilus = ["dep:bingocube-nautilus"]
biomeos = ["dep:serde_json"]
npu = ["dep:akida-driver"]
tarpc-ipc = ["dep:tarpc", "dep:tokio", "dep:serde"]

[dependencies]
barracuda = { path = "../../../barraCuda/crates/barracuda", optional = true, default-features = false }
bingocube-nautilus = { path = "../../../primalTools/bingoCube/nautilus", optional = true }
akida-driver = { path = "../../../phase1/toadstool/crates/neuromorphic/akida-driver", optional = true }
wgpu = { version = "28", optional = true, default-features = false, features = ["wgsl", "vulkan-portability"] }
bytemuck = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
tarpc = { version = "0.35", optional = true, features = ["serde-transport", "tokio1"] }
tokio = { version = "1", optional = true, features = ["rt", "net"] }

[dev-dependencies]
proptest = "1"
tempfile = "3.26.0"
