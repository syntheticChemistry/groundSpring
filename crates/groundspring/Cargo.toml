[package]
name = "groundspring"
version = "0.1.0"
description = "Measurement noise characterization primitives — bias-variance decomposition, Monte Carlo error propagation, rarefaction, seismic inversion"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
barracuda = ["dep:barracuda"]
barracuda-gpu = ["barracuda", "barracuda/gpu", "dep:pollster"]
biomeos = []
npu = ["dep:akida-driver"]

[dependencies]
barracuda = { path = "../../../phase1/toadstool/crates/barracuda", optional = true, default-features = false }
akida-driver = { path = "../../../phase1/toadstool/crates/neuromorphic/akida-driver", optional = true }
pollster = { version = "0.4", optional = true }

[dev-dependencies]
proptest = "1"
tempfile = "3.26.0"
