[package]
name = "groundspring-validate"
version = "0.1.0"
description = "Validation binaries for groundSpring — hotSpring-pattern pass/fail with hardcoded expected values"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
groundspring = { path = "../groundspring" }
serde_json = "1.0.149"

[[bin]]
name = "validate-decompose"
path = "src/validate_decompose.rs"

[[bin]]
name = "validate-rarefaction"
path = "src/validate_rarefaction.rs"

[[bin]]
name = "validate-seismic"
path = "src/validate_seismic.rs"

[[bin]]
name = "validate-weather"
path = "src/validate_weather.rs"

[[bin]]
name = "validate-fao56"
path = "src/validate_fao56.rs"

[[bin]]
name = "validate-signal-specificity"
path = "src/validate_signal_specificity.rs"

[[bin]]
name = "validate-rawr"
path = "src/validate_rawr.rs"

[[bin]]
name = "validate-anderson"
path = "src/validate_anderson.rs"

[[bin]]
name = "validate-quasiperiodic"
path = "src/validate_quasiperiodic.rs"

[[bin]]
name = "validate-bistable"
path = "src/validate_bistable.rs"

[[bin]]
name = "validate-multisignal"
path = "src/validate_multisignal.rs"

[[bin]]
name = "validate-transport"
path = "src/validate_transport.rs"

[[bin]]
name = "validate-resampling-conv"
path = "src/validate_resampling_conv.rs"

[[bin]]
name = "validate-drift"
path = "src/validate_drift.rs"
