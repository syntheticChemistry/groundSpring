[package]
name = "groundspring-validate"
version = "0.1.0"
description = "Validation binaries for groundSpring — hotSpring-pattern pass/fail with hardcoded expected values"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
biomeos = ["groundspring/biomeos"]
npu = ["groundspring/npu"]
barracuda = ["groundspring/barracuda"]
barracuda-gpu = ["groundspring/barracuda-gpu"]

[dependencies]
groundspring = { path = "../groundspring" }
serde_json = "1.0.149"

[[bin]]
name = "validate-decompose"
path = "src/validate_decompose.rs"

[[bin]]
name = "validate-rarefaction"
path = "src/validate_rarefaction.rs"

[[bin]]
name = "validate-seismic"
path = "src/validate_seismic.rs"

[[bin]]
name = "validate-weather"
path = "src/validate_weather.rs"

[[bin]]
name = "validate-fao56"
path = "src/validate_fao56.rs"

[[bin]]
name = "validate-signal-specificity"
path = "src/validate_signal_specificity.rs"

[[bin]]
name = "validate-rawr"
path = "src/validate_rawr.rs"

[[bin]]
name = "validate-anderson"
path = "src/validate_anderson.rs"

[[bin]]
name = "validate-quasiperiodic"
path = "src/validate_quasiperiodic.rs"

[[bin]]
name = "validate-bistable"
path = "src/validate_bistable.rs"

[[bin]]
name = "validate-multisignal"
path = "src/validate_multisignal.rs"

[[bin]]
name = "validate-transport"
path = "src/validate_transport.rs"

[[bin]]
name = "validate-resampling-conv"
path = "src/validate_resampling_conv.rs"

[[bin]]
name = "validate-drift"
path = "src/validate_drift.rs"

[[bin]]
name = "validate-uncertainty-bridge"
path = "src/validate_uncertainty_bridge.rs"

[[bin]]
name = "validate-rare-biosphere"
path = "src/validate_rare_biosphere.rs"

[[bin]]
name = "validate-quasispecies"
path = "src/validate_quasispecies.rs"

[[bin]]
name = "validate-band-edge"
path = "src/validate_band_edge.rs"

[[bin]]
name = "validate-jackknife"
path = "src/validate_jackknife.rs"

[[bin]]
name = "validate-freeze-out"
path = "src/validate_freeze_out.rs"

[[bin]]
name = "validate-spectral-recon"
path = "src/validate_spectral_recon.rs"

[[bin]]
name = "validate-et0-anderson"
path = "src/validate_et0_anderson.rs"

[[bin]]
name = "validate-notill-sampling"
path = "src/validate_notill_sampling.rs"

[[bin]]
name = "validate-aggregate-stability"
path = "src/validate_aggregate_stability.rs"

[[bin]]
name = "validate-precision-drift"
path = "src/validate_precision_drift.rs"

[[bin]]
name = "validate-size-convergence"
path = "src/validate_size_convergence.rs"

[[bin]]
name = "validate-vendor-parity"
path = "src/validate_vendor_parity.rs"

[[bin]]
name = "validate-npu-anderson"
path = "src/validate_npu_anderson.rs"
required-features = ["npu"]

[[bin]]
name = "bench-cpu-vs-gpu"
path = "src/bench_cpu_vs_gpu.rs"

[[bin]]
name = "validate-real-ghcnd-et0"
path = "src/validate_real_ghcnd_et0.rs"
required-features = ["biomeos"]

[[bin]]
name = "validate-real-ncbi-16s"
path = "src/validate_real_ncbi_16s.rs"
