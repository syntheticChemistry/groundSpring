[package]
name = "groundspring-validate"
version = "0.1.0"
publish = false
description = "Validation binaries for groundSpring — hotSpring-pattern pass/fail with hardcoded expected values"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
biomeos = ["groundspring/biomeos"]
npu = ["groundspring/npu"]
barracuda = ["groundspring/barracuda"]
barracuda-gpu = ["groundspring/barracuda-gpu"]
guidestone = ["dep:primalspring"]

[dependencies]
groundspring = { path = "../groundspring", default-features = false }
primalspring = { path = "../../../primalSpring/ecoPrimal", optional = true }
serde_json = "1.0.149"
thiserror = "2"

[[bin]]
name = "validate_all"
path = "src/validate_all.rs"

[[bin]]
name = "validate_decompose"
path = "src/validate_decompose.rs"

[[bin]]
name = "validate_rarefaction"
path = "src/validate_rarefaction.rs"

