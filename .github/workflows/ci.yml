# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings -W clippy::pedantic
      - run: cargo clippy --workspace --all-targets --features barracuda -- -D warnings -W clippy::pedantic
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings -W clippy::pedantic
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - run: cargo test --workspace
      - run: cargo test --workspace --features barracuda

  validate:
    name: Validation binaries
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --bin validate-decompose
      - run: cargo run --bin validate-rarefaction
      - run: cargo run --bin validate-seismic
      - run: cargo run --bin validate-weather
      - run: cargo run --bin validate-fao56
      - run: cargo run --bin validate-signal-specificity
      - run: cargo run --bin validate-rawr
      - run: cargo run --bin validate-anderson
      - run: cargo run --bin validate-quasiperiodic
      - run: cargo run --bin validate-bistable
      - run: cargo run --bin validate-multisignal
      - run: cargo run --bin validate-transport
      - run: cargo run --bin validate-resampling-conv
      - run: cargo run --bin validate-drift
      - run: cargo run --bin validate-uncertainty-bridge
      - run: cargo run --bin validate-rare-biosphere
      - run: cargo run --bin validate-quasispecies
      - run: cargo run --bin validate-band-edge
      - run: cargo run --bin validate-jackknife
      - run: cargo run --bin validate-freeze-out
      - run: cargo run --bin validate-spectral-recon
      - run: cargo run --bin validate-et0-anderson
      - run: cargo run --bin validate-notill-sampling
      - run: cargo run --bin validate-aggregate-stability
      - run: cargo run --bin validate-precision-drift
      - run: cargo run --bin validate-size-convergence
      - run: cargo run --bin validate-vendor-parity
      - run: cargo run --bin validate-npu-anderson || echo "NPU binary skipped (requires AKD1000 hardware)"
      - run: cargo run --bin validate-tissue-anderson

  validate-metalforge:
    name: metalForge validation
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --bin validate-metalforge-inventory || echo "metalForge inventory skipped (requires GPU hardware)"
      - run: cargo run --bin validate-metalforge-spectral || echo "metalForge spectral skipped (requires GPU hardware)"
      - run: cargo run --bin validate-metalforge-mathieu || echo "metalForge mathieu skipped (requires GPU hardware)"
      - run: cargo run --bin validate-metalforge-pipeline || echo "metalForge pipeline skipped (requires GPU hardware)"
      - run: cargo run --bin validate-metalforge-gpu || echo "metalForge GPU skipped (requires GPU hardware)"

  python:
    name: Python baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check control/ tests/
      - run: mypy control/ tests/
      - run: python -m pytest tests/test_common.py tests/test_determinism.py tests/test_baseline_integrity.py -v
      - run: python -m pytest tests/test_experiments.py -v --timeout=300
      - run: python -m pytest tests/ --cov=control --cov-fail-under=80 --timeout=300

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - run: cargo install cargo-llvm-cov
      - run: cargo llvm-cov --workspace --ignore-filename-regex '(validate_|bench_|bin/)' --lcov --output-path lcov.info --fail-under-lines 90
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: lcov.info
