# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo clippy --workspace --features barracuda -- -D warnings
      - run: cargo doc --workspace --no-deps
      - run: cargo test --workspace
      - run: cargo test --workspace --features barracuda

  validate:
    name: Validation binaries
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --bin validate-decompose
      - run: cargo run --bin validate-rarefaction
      - run: cargo run --bin validate-seismic
      - run: cargo run --bin validate-weather
      - run: cargo run --bin validate-fao56
      - run: cargo run --bin validate-signal-specificity
      - run: cargo run --bin validate-rawr
      - run: cargo run --bin validate-anderson
      - run: cargo run --bin validate-quasiperiodic
      - run: cargo run --bin validate-bistable
      - run: cargo run --bin validate-multisignal
      - run: cargo run --bin validate-transport
      - run: cargo run --bin validate-resampling-conv
      - run: cargo run --bin validate-drift
      - run: cargo run --bin validate-uncertainty-bridge
      - run: cargo run --bin validate-rare-biosphere
      - run: cargo run --bin validate-quasispecies
      - run: cargo run --bin validate-band-edge
      - run: cargo run --bin validate-jackknife
      - run: cargo run --bin validate-freeze-out
      - run: cargo run --bin validate-spectral-recon

  python:
    name: Python baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check control/ tests/
      - run: mypy control/ tests/
      - run: python -m pytest tests/test_common.py tests/test_determinism.py tests/test_baseline_integrity.py -v
      - run: python -m pytest tests/test_experiments.py -v --timeout=300

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - run: cargo install cargo-llvm-cov
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: lcov.info
