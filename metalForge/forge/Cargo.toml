# SPDX-License-Identifier: AGPL-3.0-only

[package]
name = "groundspring-forge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Hardware discovery and cross-substrate dispatch for groundSpring"

[features]
default = []
barracuda-gpu = ["groundspring/barracuda-gpu"]
npu = ["groundspring/npu"]
biomeos = ["groundspring/biomeos"]

[dependencies]
groundspring = { path = "../../crates/groundspring" }
barracuda = { path = "../../../barraCuda/crates/barracuda", features = ["gpu"] }
wgpu = { version = "22", default-features = false, features = [
    "wgsl",
    "vulkan-portability",
] }
bytemuck = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "validate-metalforge-inventory"
path = "src/bin/validate_metalforge_inventory.rs"

[[bin]]
name = "validate-metalforge-gpu"
path = "src/bin/validate_metalforge_gpu.rs"

[[bin]]
name = "validate-metalforge-titan-v"
path = "src/bin/validate_metalforge_titan_v.rs"

[[bin]]
name = "validate-metalforge-cross-substrate"
path = "src/bin/validate_metalforge_cross_substrate.rs"
required-features = ["npu"]

[[bin]]
name = "validate-metalforge-spectral"
path = "src/bin/validate_metalforge_spectral.rs"

[[bin]]
name = "validate-metalforge-mathieu"
path = "src/bin/validate_metalforge_mathieu.rs"

[[bin]]
name = "benchmark-cross-spring"
path = "src/bin/benchmark_cross_spring.rs"

[[bin]]
name = "validate-gpu-tier"
path = "src/bin/validate_gpu_tier/main.rs"

[[bin]]
name = "validate-pure-gpu-workloads"
path = "src/bin/validate_pure_gpu_workloads.rs"

[[bin]]
name = "validate-nestgate-ncbi"
path = "src/bin/validate_nestgate_ncbi.rs"
required-features = ["biomeos"]

[[bin]]
name = "validate-mixed-hardware"
path = "src/bin/validate_mixed_hardware.rs"

[[bin]]
name = "validate-nucleus-pipeline"
path = "src/bin/validate_nucleus_pipeline.rs"
required-features = ["biomeos"]

[[bin]]
name = "validate-metalforge-pipeline"
path = "src/bin/validate_metalforge_pipeline.rs"

[lints]
workspace = true
