# SPDX-License-Identifier: AGPL-3.0-or-later

[package]
name = "groundspring-forge"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Hardware discovery and cross-substrate dispatch for groundSpring"

[features]
default = []
barracuda-gpu = ["groundspring/barracuda-gpu"]
npu = ["groundspring/npu"]

[dependencies]
groundspring = { path = "../../crates/groundspring" }
wgpu = { version = "22", default-features = false, features = [
    "wgsl",
    "vulkan-portability",
] }

[[bin]]
name = "validate-metalforge-inventory"
path = "src/bin/validate_metalforge_inventory.rs"

[[bin]]
name = "validate-metalforge-gpu"
path = "src/bin/validate_metalforge_gpu.rs"

[[bin]]
name = "validate-metalforge-cross-substrate"
path = "src/bin/validate_metalforge_cross_substrate.rs"
required-features = ["npu"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
