# SPDX-License-Identifier: AGPL-3.0-or-later

[package]
name = "groundspring-forge"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Hardware discovery and cross-substrate dispatch for groundSpring"

[features]
default = []
barracuda-gpu = ["groundspring/barracuda-gpu", "dep:barracuda"]
npu = ["groundspring/npu"]
biomeos = ["groundspring/biomeos"]

[dependencies]
tracing = "0.1"
pollster = "0.4"
groundspring = { path = "../../crates/groundspring" }
barracuda = { path = "../../../../primals/barraCuda/crates/barracuda", optional = true, default-features = false, features = ["gpu"] }
wgpu = { version = "28", default-features = false, features = [
    "wgsl",
    "vulkan",
    "vulkan-portability",
] }
bytemuck = { version = "1", features = ["derive"], optional = true }
serde_json = "1"

[[bin]]
name = "validate_metalforge_inventory"
path = "src/bin/validate_metalforge_inventory.rs"

[[bin]]
name = "validate_metalforge_gpu"
path = "src/bin/validate_metalforge_gpu.rs"

[[bin]]
name = "validate_metalforge_titan_v"
path = "src/bin/validate_metalforge_titan_v.rs"
required-features = ["bytemuck"]

[[bin]]
name = "validate_metalforge_cross_substrate"
path = "src/bin/validate_metalforge_cross_substrate.rs"
required-features = ["npu"]

[[bin]]
name = "validate_metalforge_spectral"
path = "src/bin/validate_metalforge_spectral.rs"

[[bin]]
name = "validate_metalforge_mathieu"
path = "src/bin/validate_metalforge_mathieu.rs"

[[bin]]
name = "benchmark_cross_spring"
path = "src/bin/benchmark_cross_spring.rs"

[[bin]]
name = "validate_gpu_tier"
path = "src/bin/validate_gpu_tier/main.rs"

[[bin]]
name = "validate_pure_gpu_workloads"
path = "src/bin/validate_pure_gpu_workloads.rs"

[[bin]]
name = "validate_nestgate_ncbi"
path = "src/bin/validate_nestgate_ncbi.rs"
required-features = ["biomeos"]

[[bin]]
name = "validate_mixed_hardware"
path = "src/bin/validate_mixed_hardware.rs"

[[bin]]
name = "validate_nucleus_pipeline"
path = "src/bin/validate_nucleus_pipeline.rs"
required-features = ["biomeos"]

[[bin]]
name = "validate_metalforge_pipeline"
path = "src/bin/validate_metalforge_pipeline.rs"

[lints]
workspace = true
