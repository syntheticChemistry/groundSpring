[project]
name = "groundspring"
version = "0.1.0"
description = "The Dirty Differences — measurement noise characterization across scientific domains"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "PLW",    # pylint warnings
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line length handled by formatter
    "RUF001", # Greek letters (α, β, σ, μ) are intentional in scientific code
    "RUF002", # same, in docstrings
    "RUF003", # same, in comments
    "N806",   # uppercase variables (N, R2, S_star) follow scientific convention
]

[tool.ruff.lint.isort]
known-first-party = ["control"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
mypy_path = ["control"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "penman_monteith",
    "sensor_noise.*",
    "sequencing_noise.*",
    "seismic.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["control"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
