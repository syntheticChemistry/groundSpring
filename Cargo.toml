[workspace]
resolver = "2"
members = [
    "crates/groundspring",
    "crates/groundspring-validate",
    "metalForge/forge",
]

[workspace.package]
edition = "2024"
rust-version = "1.87"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ecoPrimals/groundSpring"

[workspace.lints.rust]
# "deny" (not "forbid") so test code using temp-env can compile (temp-env
# internally uses set_var/remove_var which are unsafe in Rust 2024). Each
# lib.rs re-asserts #![forbid(unsafe_code)] for production code.
unsafe_code = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
