[workspace]
resolver = "2"
# blake3 is not a direct groundspring dependency; it arrives transitively via optional
# path deps (primalspring, barracuda, bingocube-nautilus). cc-free builds require
# `blake3` with `default-features = false, features = ["pure"]` in those upstream
# workspaces. barraCuda and bingoCube already do; primalSpring sets `features = ["pure"]`
# but omits `default-features = false`, so `cc` still enters Cargo.lock as a blake3
# build-dependency. Fix belongs in primalSpring (or a shared ecoPrimals workspace pin).
members = [
    "crates/groundspring",
    "crates/groundspring-validate",
    "metalForge/forge",
    "experiments/exp094_composition_parity",
    "experiments/exp095_measurement_niche",
]

[workspace.package]
edition = "2024"
rust-version = "1.87"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ecoPrimals/groundSpring"

[workspace.lints.rust]
# "deny" (not "forbid") so test code using temp-env can compile (temp-env
# internally uses set_var/remove_var which are unsafe in Rust 2024). Each
# lib.rs re-asserts #![forbid(unsafe_code)] for production code.
unsafe_code = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
